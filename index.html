<!doctype html>
<html lang="en" data-booted="false">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Vinland</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
  </head>
  <body>
    <!-- The shell is the whole viewport. Panes are generated from src/core/layout.js. -->
    <main id="shell" class="shell" aria-label="Vinland">
      <noscript>
        <p class="pane pane--fallback">Vinland needs JavaScript enabled.</p>
      </noscript>
    </main>

    <!--
      Classic scripts, not ES modules, and order matters: kernel first, then modules,
      then the entry point. This is what lets Vinland run by double-clicking this file
      (see docs/ARCHITECTURE.md, ADR-0003). A mod is one more <script> tag before main.js.
    -->
    <script src="./src/kernel.js"></script>
    <script src="./src/core/layout.js"></script>
    <script src="./src/ui/shell.js"></script>
    <script src="./src/main.js"></script>
  </body>
</html>
